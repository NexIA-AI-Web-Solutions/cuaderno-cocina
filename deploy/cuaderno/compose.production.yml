name: cuaderno-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: cuaderno_prod
      POSTGRES_USER: cuaderno_prod
      POSTGRES_PASSWORD: ${CUADERNO_DB_PASSWORD:?secreto requerido}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cuaderno_prod -d cuaderno_prod]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    mem_limit: ${CUADERNO_DB_MEMORY:-1g}
  media-init:
    network_mode: none
    read_only: true
    image: ${CUADERNO_IMAGE:?Image ID local requerido}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 10001:10001 /media"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    volumes:
      - media:/media
    logging: *logging
  web:
    image: ${CUADERNO_IMAGE:?Image ID local requerido}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CUADERNO_HTTP_PORT:-8080}:80"
    environment:
      DJANGO_SETTINGS_MODULE: recipes.cuaderno_production_settings
      SECRET_KEY: ${CUADERNO_SECRET_KEY:?secreto requerido}
      DB_ENGINE: django.db.backends.postgresql
      DB_OPTIONS: "{'options': '-c jit=off'}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cuaderno_prod
      POSTGRES_USER: cuaderno_prod
      POSTGRES_PASSWORD: ${CUADERNO_DB_PASSWORD:?secreto requerido}
      ALLOWED_HOSTS: 127.0.0.1,localhost,${CUADERNO_DOMAIN:?dominio requerido}
      CSRF_TRUSTED_ORIGINS: https://${CUADERNO_DOMAIN:?dominio requerido}
      ALLAUTH_TRUSTED_PROXY_COUNT: ${CUADERNO_PROXY_COUNT:-1}
      TZ: ${CUADERNO_TIMEZONE:-Europe/Madrid}
      CUADERNO_LANGUAGE: es
      ENABLE_SIGNUP: "0"
      DEBUG: "0"
      PLUGINS_BUILD: "0"
      GUNICORN_MEDIA: "0"
      GUNICORN_WORKERS: ${CUADERNO_WORKERS:-2}
      GUNICORN_THREADS: ${CUADERNO_THREADS:-2}
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${CUADERNO_WEB_MEMORY:-2g}
    stop_grace_period: 45s
    volumes:
      - media:/opt/recipes/mediafiles

volumes:
  database:
  media:
