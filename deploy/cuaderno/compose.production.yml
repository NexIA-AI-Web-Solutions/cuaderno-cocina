name: cuaderno-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    user: postgres
    cap_drop: [ALL]
    logging: *logging
    environment:
      POSTGRES_DB: cuaderno_prod
      POSTGRES_USER: cuaderno_prod
      POSTGRES_PASSWORD: ${CUADERNO_DB_PASSWORD:?secreto requerido}
    volumes:
      - database:/var/lib/postgresql/data
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=2MB, -c, maintenance_work_mem=32MB]
    cpus: ${CUADERNO_DB_CPUS:-0.5}
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -t 1 -U cuaderno_prod -d cuaderno_prod >/dev/null 2>&1 && result=$$(PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=1000' timeout 2 psql -X -w -h /var/run/postgresql -U cuaderno_prod -d cuaderno_prod -v ON_ERROR_STOP=1 -At -c 'SELECT 1' 2>/dev/null) && [ \"$$result\" = \"1\" ]"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    mem_limit: ${CUADERNO_DB_MEMORY:-512m}
  media-init:
    network_mode: none
    read_only: true
    image: ${CUADERNO_IMAGE:?Image ID local requerido}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 10001:10001 /media"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    volumes:
      - media:/media
    logging: *logging
  web:
    image: ${CUADERNO_IMAGE:?Image ID local requerido}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CUADERNO_HTTP_PORT:-18081}:80"
    environment:
      DJANGO_SETTINGS_MODULE: recipes.cuaderno_production_settings
      SECRET_KEY: ${CUADERNO_SECRET_KEY:?secreto requerido}
      DB_ENGINE: django.db.backends.postgresql
      DB_OPTIONS: "{'options': '-c jit=off'}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cuaderno_prod
      POSTGRES_USER: cuaderno_prod
      POSTGRES_PASSWORD: ${CUADERNO_DB_PASSWORD:?secreto requerido}
      ALLOWED_HOSTS: 127.0.0.1,localhost,${CUADERNO_DOMAIN:?dominio requerido}
      CSRF_TRUSTED_ORIGINS: https://${CUADERNO_DOMAIN:?dominio requerido}
      ALLAUTH_TRUSTED_PROXY_COUNT: ${CUADERNO_PROXY_COUNT:-2}
      TZ: ${CUADERNO_TIMEZONE:-Europe/Madrid}
      CUADERNO_LANGUAGE: es
      SCRIPT_NAME: ${CUADERNO_SCRIPT_NAME:-/cuaderno-cocina}
      STATIC_URL: ${CUADERNO_STATIC_URL:-/cuaderno-cocina/static/}
      MEDIA_URL: ${CUADERNO_MEDIA_URL:-/cuaderno-cocina/media/}
      SESSION_COOKIE_NAME: cuaderno_sessionid
      CSRF_COOKIE_NAME: cuaderno_csrftoken
      LANGUAGE_COOKIE_NAME: cuaderno_language
      SESSION_COOKIE_PATH: ${CUADERNO_COOKIE_PATH:-/cuaderno-cocina/}
      CSRF_COOKIE_PATH: ${CUADERNO_COOKIE_PATH:-/cuaderno-cocina/}
      LANGUAGE_COOKIE_PATH: ${CUADERNO_COOKIE_PATH:-/cuaderno-cocina/}
      LANGUAGE_COOKIE_SECURE: '1'
      ENABLE_SIGNUP: "0"
      DEBUG: "0"
      PLUGINS_BUILD: "0"
      GUNICORN_MEDIA: "0"
      GUNICORN_WORKERS: ${CUADERNO_WORKERS:-1}
      GUNICORN_THREADS: ${CUADERNO_THREADS:-2}
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${CUADERNO_WEB_MEMORY:-768m}
    cpus: ${CUADERNO_WEB_CPUS:-0.5}
    stop_grace_period: 45s
    volumes:
      - media:/opt/recipes/mediafiles

volumes:
  database:
  media:
