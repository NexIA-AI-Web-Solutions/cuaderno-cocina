name: Cuaderno Cocina CI

on:
  push:
    branches: [cuaderno/main]
  pull_request:
    branches: [cuaderno/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuaderno-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: yarn
          cache-dependency-path: vue3/yarn.lock
      - name: Dependencias exactas de tooling
        run: >-
          python -m pip install -c tooling/cuaderno/python-tooling.constraints.txt
          -c tooling/cuaderno/python-test.constraints.txt
          packaging==26.3 jsonschema==4.26.0 referencing==0.37.0 PyJWT==2.15.0
          cryptography==50.0.1 oauthlib==3.3.1 PyYAML==6.0.3
      - name: Todos los contratos unitarios de tooling
        run: python -m unittest discover -s scripts/cuaderno -p 'test_*.py' -v
      - name: Procedencia frontend
        run: node --test scripts/cuaderno/test_frontend_inventory.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: yarn
          cache-dependency-path: vue3/yarn.lock
      - name: Instalar lock autoritativo
        working-directory: vue3
        run: yarn install --frozen-lockfile --non-interactive
      - name: Unitarias frontend sin runtime
        working-directory: vue3
        shell: bash
        run: |
          mapfile -d '' tests < <(find src/cuaderno src/stores src/utils -name '*.test.mjs' ! -name 'markdownSecurity.test.mjs' -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
      - name: TypeScript estricto sin diagnosticos heredados
        run: python scripts/cuaderno/typecheck_container.py
      - name: Build Vue/PWA con procedencia
        working-directory: vue3
        run: yarn build

  backend-cuaderno-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cuaderno_ci_app
          POSTGRES_USER: cuaderno_ci
          POSTGRES_PASSWORD: cuaderno-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuaderno_ci -d cuaderno_ci_app"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: recipes.test_settings
      TEST_DB_ENGINE: django.db.backends.postgresql
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: cuaderno_ci_app
      TEST_POSTGRES_USER: cuaderno_ci
      TEST_POSTGRES_PASSWORD: cuaderno-ci-only
      TEST_DB_OPTIONS: "{'options': '-c jit=off'}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Librerias de compilacion
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential libpq-dev libjpeg-dev libwebp-dev libxml2-dev libxslt1-dev
          libldap2-dev libsasl2-dev libssl-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Dependencias de produccion antes del overlay de test
        shell: bash
        run: |
          sed '/# Development/,$d' requirements.txt > /tmp/cuaderno-production-requirements.txt
          python -c 'from pathlib import Path; from scripts.cuaderno.release_runtime_check import _dev_requirements; Path("/tmp/cuaderno-test-requirements.txt").write_text(_dev_requirements(Path(".")))'
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt pip setuptools wheel setuptools-rust
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt -r /tmp/cuaderno-production-requirements.txt
          python scripts/cuaderno/python_lock.py --constraints tooling/cuaderno/python-production.constraints.txt --requirements /tmp/cuaderno-production-requirements.txt --installed
          python scripts/cuaderno/check_oauthlib_runtime.py
          python -m pip check
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt -c tooling/cuaderno/python-test.constraints.txt -r /tmp/cuaderno-test-requirements.txt
      - name: Suite Cuaderno completa en PostgreSQL
        run: python manage.py test cuaderno.tests --noinput --verbosity 2
      - name: OpenAPI sin warnings, snapshot exacto y SDK reproducible
        shell: bash
        run: |
          mkdir -p .cuaderno-runs
          python manage.py spectacular --validate --fail-on-warn --format openapi-json --file .cuaderno-runs/openapi.generated.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tooling/cuaderno/openapi.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('.cuaderno-runs/openapi.generated.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('El OpenAPI generado no coincide con tooling/cuaderno/openapi.json')
          PY
          python scripts/generate_api_client.py --schema .cuaderno-runs/openapi.generated.json --check

  backend-native-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cuaderno_ci_native
          POSTGRES_USER: cuaderno_ci
          POSTGRES_PASSWORD: cuaderno-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuaderno_ci -d cuaderno_ci_native"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: recipes.test_settings
      TEST_DB_ENGINE: django.db.backends.postgresql
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: cuaderno_ci_native
      TEST_POSTGRES_USER: cuaderno_ci
      TEST_POSTGRES_PASSWORD: cuaderno-ci-only
      TEST_DB_OPTIONS: "{'options': '-c jit=off'}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Librerias de compilacion
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential libpq-dev libjpeg-dev libwebp-dev libxml2-dev libxslt1-dev
          libldap2-dev libsasl2-dev libssl-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Dependencias de produccion antes del overlay de test
        shell: bash
        run: |
          sed '/# Development/,$d' requirements.txt > /tmp/cuaderno-production-requirements.txt
          python -c 'from pathlib import Path; from scripts.cuaderno.release_runtime_check import _dev_requirements; Path("/tmp/cuaderno-test-requirements.txt").write_text(_dev_requirements(Path(".")))'
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt pip setuptools wheel setuptools-rust
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt -r /tmp/cuaderno-production-requirements.txt
          python scripts/cuaderno/python_lock.py --constraints tooling/cuaderno/python-production.constraints.txt --requirements /tmp/cuaderno-production-requirements.txt --installed
          python scripts/cuaderno/check_oauthlib_runtime.py
          python -m pip check
          python -m pip install -c tooling/cuaderno/python-production.constraints.txt -c tooling/cuaderno/python-test.constraints.txt -r /tmp/cuaderno-test-requirements.txt
      - name: Suite nativa completa en PostgreSQL
        run: python -m pytest -o addopts= -vv -o faulthandler_timeout=60 cookbook/tests

  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [tooling, frontend, backend-cuaderno-postgresql, backend-native-postgresql]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Identidad exacta de fuente
        id: source
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          source_hash=$(python -c 'from scripts.cuaderno.delivery_backup import source_manifest; print(source_manifest()["sha256"])')
          echo "identity=$(git rev-parse HEAD)+worktree.$source_hash" >> "$GITHUB_OUTPUT"
      - name: Construir y verificar paquetes de seguridad desde fuentes fijadas
        run: python scripts/cuaderno/build_runtime_security_apks.py --output .cuaderno-runs/runtime-security-ci
      - name: Construir una sola imagen candidata
        run: >-
          docker build --pull -f deploy/cuaderno/Dockerfile
          --build-context runtime_security=.cuaderno-runs/runtime-security-ci
          --build-arg SOURCE_COMMIT=${{ steps.source.outputs.identity }}
          -t cuaderno-cocina:ci .
      - name: Contratos inmutables sin base de datos
        shell: bash
        run: |
          for check in runtime-python-lock runtime-pip-check frontend-provenance sbom-python sbom-frontend; do
            docker run --rm --entrypoint /opt/recipes/venv/bin/python cuaderno-cocina:ci \
              /opt/recipes/release-tools/release_runtime_check.py "$check" --inside
          done
      - name: Exportar imagen por ID y hash
        shell: bash
        run: |
          image_id=$(docker image inspect cuaderno-cocina:ci --format '{{.Id}}')
          test "$(docker image inspect cuaderno-cocina:ci --format '{{index .Config.Labels "io.cuaderno.source-identity"}}')" = '${{ steps.source.outputs.identity }}'
          printf '%s\n' "$image_id" > candidate-image-id.txt
          printf '%s\n' '${{ steps.source.outputs.identity }}' > candidate-source-identity.txt
          docker save cuaderno-cocina:ci | gzip -1 > candidate-image.tar.gz
          sha256sum candidate-image.tar.gz > candidate-image.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: cuaderno-candidate-image
          path: |
            candidate-image.tar.gz
            candidate-image.tar.gz.sha256
            candidate-image-id.txt
            candidate-source-identity.txt
          compression-level: 0
          retention-days: 3

  markdown-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: candidate-image
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cuaderno_ci_markdown
          POSTGRES_USER: cuaderno_ci
          POSTGRES_PASSWORD: cuaderno-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuaderno_ci -d cuaderno_ci_markdown"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: yarn
          cache-dependency-path: vue3/yarn.lock
      - uses: actions/download-artifact@v8
        with:
          name: cuaderno-candidate-image
      - name: Cargar la imagen candidata exacta
        shell: bash
        run: |
          sha256sum -c candidate-image.tar.gz.sha256
          gunzip -c candidate-image.tar.gz | docker load
          test "$(docker image inspect cuaderno-cocina:ci --format '{{.Id}}')" = "$(cat candidate-image-id.txt)"
      - name: Instalar frontend para Markdown
        working-directory: vue3
        run: yarn install --frozen-lockfile --non-interactive
      - name: Arrancar runtime Markdown aislado
        shell: bash
        run: |
          docker run -d --name cuaderno-g0-t002-web \
            --add-host=host.docker.internal:host-gateway \
            -e SECRET_KEY=cuaderno-ci-synthetic-secret-not-for-production \
            -e ALLOWED_HOSTS=127.0.0.1,localhost \
            -e DB_ENGINE=django.db.backends.postgresql -e DB_OPTIONS="{'options': '-c jit=off'}" \
            -e POSTGRES_HOST=host.docker.internal -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=cuaderno_ci_markdown -e POSTGRES_USER=cuaderno_ci \
            -e POSTGRES_PASSWORD=cuaderno-ci-only -e ENABLE_SIGNUP=0 -e DEBUG=0 \
            cuaderno-cocina:ci
          test "$(docker inspect cuaderno-g0-t002-web --format '{{.Image}}')" = "$(cat candidate-image-id.txt)"
          for attempt in $(seq 1 120); do
            if docker exec cuaderno-g0-t002-web /opt/recipes/venv/bin/python -c \
              "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1/health/ready/',timeout=3))['ready'] is True"; then
              exit 0
            fi
            sleep 2
          done
          docker logs cuaderno-g0-t002-web
          exit 1
      - name: Integracion Markdown backend y Vue
        working-directory: vue3
        run: node --test src/cuaderno/markdownSecurity.test.mjs
      - name: Diagnostico Markdown
        if: failure()
        run: docker logs cuaderno-g0-t002-web || true
      - name: Cerrar runtime Markdown aislado
        if: always()
        run: docker rm -f cuaderno-g0-t002-web >/dev/null 2>&1 || true

  playwright-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: candidate-image
    env:
      BASE_URL: http://127.0.0.1:18081
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: tests/cuaderno/e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: cuaderno-candidate-image
      - name: Cargar la imagen candidata exacta
        shell: bash
        run: |
          sha256sum -c candidate-image.tar.gz.sha256
          gunzip -c candidate-image.tar.gz | docker load
          test "$(docker image inspect cuaderno-cocina:ci --format '{{.Id}}')" = "$(cat candidate-image-id.txt)"
          docker tag "$(cat candidate-image-id.txt)" cuaderno-cocina:local
      - name: Instalar Playwright bloqueado y los tres motores
        working-directory: tests/cuaderno/e2e
        run: |
          npm ci
          node --test *.test.mjs
          npx playwright install --with-deps chromium firefox webkit
          npm run typecheck
          npx playwright test --list
      - name: Crear secretos sinteticos efimeros
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          secret_key=$(openssl rand -hex 48)
          demo_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$demo_password"
          echo "CUADERNO_LOCAL_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "CUADERNO_LOCAL_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "CUADERNO_DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
      - name: Arrancar preview candidato aislado
        shell: bash
        run: |
          mkdir -p data/cuaderno/local
          chmod 700 data/cuaderno/local
          env_file=data/cuaderno/local/compose.env
          printf 'CUADERNO_LOCAL_DB_PASSWORD=%s\nCUADERNO_LOCAL_SECRET_KEY=%s\n' \
            "$CUADERNO_LOCAL_DB_PASSWORD" "$CUADERNO_LOCAL_SECRET_KEY" > "$env_file"
          chmod 600 "$env_file"
          export CUADERNO_LOCAL_IMAGE="$(cat candidate-image-id.txt)"
          docker compose --project-name cuaderno-release --env-file "$env_file" \
            -f deploy/cuaderno/compose.local.yml up -d --wait --wait-timeout 600
          test "$(docker inspect cuaderno-release-web --format '{{.Image}}')" = "$(cat candidate-image-id.txt)"
          test "$(docker inspect cuaderno-release-web --format '{{.Config.Image}}')" = "$(cat candidate-image-id.txt)"
      - name: Sembrar fixtures sinteticos guardados
        run: >-
          docker exec -e CUADERNO_ENV=local -e CUADERNO_DEMO_PASSWORD="$CUADERNO_DEMO_PASSWORD"
          cuaderno-release-web /opt/recipes/venv/bin/python manage.py seed_cuaderno_e2e
      - name: Preparar autenticacion una vez
        working-directory: tests/cuaderno/e2e
        run: |
          node prepare-auth.mjs --base-url "$BASE_URL"
          node prepare-auth.mjs --base-url "$BASE_URL" --reuse
      - name: Matriz completa sin retries y con preview verificado
        shell: bash
        run: |
          mkdir -p .cuaderno-runs
          export CUADERNO_CANDIDATE_IMAGE="$(cat candidate-image-id.txt)"
          python scripts/cuaderno/release_e2e_check.py
      - name: Capturar diagnostico del preview
        if: failure()
        shell: bash
        run: |
          mkdir -p tests/cuaderno/e2e/runtime-diagnostics
          docker compose --project-name cuaderno-release --env-file data/cuaderno/local/compose.env \
            -f deploy/cuaderno/compose.local.yml ps > tests/cuaderno/e2e/runtime-diagnostics/compose-ps.txt || true
          docker logs cuaderno-release-web > tests/cuaderno/e2e/runtime-diagnostics/web.log 2>&1 || true
          docker logs cuaderno-release-db > tests/cuaderno/e2e/runtime-diagnostics/db.log 2>&1 || true
      - name: Subir informes HTML por edicion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cuaderno-playwright-reports-${{ github.run_id }}
          path: .cuaderno-runs/e2e-final-*/playwright-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Subir evidencia Playwright solo al fallar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cuaderno-playwright-failure-${{ github.run_id }}
          path: |
            .cuaderno-runs/e2e-final-*/test-results
            tests/cuaderno/e2e/runtime-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Cerrar preview aislado
        if: always()
        shell: bash
        run: |
          if test -f data/cuaderno/local/compose.env; then
            docker compose --project-name cuaderno-release --env-file data/cuaderno/local/compose.env \
              -f deploy/cuaderno/compose.local.yml down --remove-orphans || true
          fi
