name: Cuaderno G7Recovery433

on:
  push:
    branches: [cuaderno/g7-recovery-20261009]

permissions:
  contents: read
  actions: read

concurrency:
  group: cuaderno-g7-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'push' && github.ref == 'refs/heads/cuaderno/g7-recovery-20261009'
    defaults:
      run:
        working-directory: runtime-source
    env:
      CUADERNO_ENV: test
      CUADERNO_BACKUP_TARGET: release
      CI: '1'
    steps:
      - name: Controlador explícito, separado de la fuente runtime
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
      - name: Fuente runtime congelada 4335e6e
        uses: actions/checkout@v7
        with:
          ref: 4335e6e9b858581c724e154c799c095cddb88383
          path: runtime-source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: cuaderno-candidate-image
          run-id: 37972458941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-source/.cuaderno-runs
      - uses: actions/download-artifact@v8
        with:
          name: cuaderno-e2e-records-root
          run-id: 37972458941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-source/.cuaderno-runs
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 11605008153
          run-id: 37905852791
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-source/.cuaderno-runs/prior-image
      - name: Procedencia del controlador y contexto original inmutable
        shell: bash
        env:
          G7_CONTROLLER_SHA: ${{ github.sha }}
          G7_CONTROLLER_RUN: ${{ github.run_id }}
        run: |
          python - <<'PYPROOF'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/cuaderno')
          from candidate_context import source_identity
          source = source_identity(Path.cwd())
          expected = {'git_commit': '4335e6e9b858581c724e154c799c095cddb88383',
              'source_sha256': '111e3b15e098839437c8e64a67bb3a9b34a04863f946ca344a7e7a853c377f05',
              'source_identity': '4335e6e9b858581c724e154c799c095cddb88383+worktree.111e3b15e098839437c8e64a67bb3a9b34a04863f946ca344a7e7a853c377f05'}
          assert source == expected, 'Runtime source identity mismatch'
          controller = subprocess.check_output(['git', '-C', '../controller', 'rev-parse', 'HEAD'], text=True).strip()
          assert controller == os.environ['G7_CONTROLLER_SHA'] and controller != expected['git_commit']
          context_path = Path('.cuaderno-runs/ci-context.json')
          context = json.loads(context_path.read_bytes())
          assert all(context.get(key) == value for key, value in expected.items())
          assert context['image_id'] == 'sha256:79a4eab1018a7afcd7f22c1dbc16cb76d43a226fcb0f1804366b94dda00a28ba'
          prior = Path('.cuaderno-runs/prior-image/candidate-source-identity.txt').read_text().strip()
          assert prior == '643e37ada841b182890daf77790e3e21768d5952+worktree.9205105e02bccdb45ff5cc6048720e2a293532b660db2c3ee46e52394f52623b'
          proof = {'schema_version': 1, 'controller_commit': controller,
              'controller_run_id': int(os.environ['G7_CONTROLLER_RUN']), 'runtime_source': source,
              'candidate_run_id': 37972458941, 'root_records_run_id': 37972458941,
              'prior_run_id': 37905852791, 'prior_artifact_id': 11605008153,
              'prior_source_identity': prior, 'context_sha256': hashlib.sha256(context_path.read_bytes()).hexdigest(),
              'context_regenerated': False, 'original_run_reclassified': False}
          output = Path(os.environ['RUNNER_TEMP']) / 'g7-recovery-controller-provenance.json'
          with output.open('x') as stream:
              os.fchmod(stream.fileno(), 0o600)
              json.dump(proof, stream, sort_keys=True)
              stream.write('\n')
          PYPROOF
      - name: Secretos sinteticos y entorno previo aislado
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          secret_key=$(openssl rand -hex 48)
          demo_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$demo_password"
          echo "CUADERNO_DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
          mkdir -p data/cuaderno/local data/cuaderno/backups
          printf 'CUADERNO_LOCAL_DB_PASSWORD=%s\nCUADERNO_LOCAL_SECRET_KEY=%s\n' "$db_password" "$secret_key" > data/cuaderno/local/compose.env
          chmod 600 data/cuaderno/local/compose.env
          cd .cuaderno-runs/prior-image
          python - <<'PYPRIORHASH'
          import hashlib, re
          from pathlib import Path
          descriptor = Path('candidate-image.tar.gz.sha256').read_bytes()
          match = re.fullmatch(rb'([a-f0-9]{64})  \.cuaderno-runs/candidate-image\.tar\.gz\n', descriptor)
          if match is None:
              raise SystemExit('Invalid prior checksum descriptor')
          with Path('candidate-image.tar.gz').open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != match[1].decode('ascii'):
              raise SystemExit('Prior archive checksum mismatch')
          PYPRIORHASH
          gunzip -c candidate-image.tar.gz | docker load
          cd ../..
          python scripts/cuaderno/verify_loaded_image.py --archive .cuaderno-runs/prior-image/candidate-image.tar.gz \
            --image-id-file .cuaderno-runs/prior-image/candidate-image-id.txt \
            --source-identity-file .cuaderno-runs/prior-image/candidate-source-identity.txt \
            --local-id-output .cuaderno-runs/prior-local-image-id.txt --report .cuaderno-runs/prior-image-binding.json
          prior_id=$(cat .cuaderno-runs/prior-local-image-id.txt)
          git worktree add --detach .cuaderno-runs/prior-source 643e37ada841b182890daf77790e3e21768d5952
          CUADERNO_LOCAL_IMAGE="$prior_id" docker compose --project-name cuaderno-prior-ci \
            --env-file data/cuaderno/local/compose.env -f .cuaderno-runs/prior-source/deploy/cuaderno/compose.local.yml \
            up -d --wait --wait-timeout 600
          docker exec -e CUADERNO_ENV=test -e CUADERNO_DEMO_PASSWORD="$demo_password" \
            cuaderno-release-web /opt/recipes/venv/bin/python manage.py seed_cuaderno_demo
          export CUADERNO_DEMO_PASSWORD="$demo_password"
          cd .cuaderno-runs/prior-source
          python -c 'from scripts.cuaderno.delivery_backup import create_backup; print(create_backup())' > ../prior-bundle-path.txt
          cd ../..
          prior_bundle=$(tail -1 .cuaderno-runs/prior-bundle-path.txt)
          cp -a "$prior_bundle" data/cuaderno/backups/prior-ci
          echo "CUADERNO_PRIOR_RELEASE_BUNDLE=data/cuaderno/backups/prior-ci" >> "$GITHUB_ENV"
          CUADERNO_LOCAL_IMAGE="$prior_id" docker compose --project-name cuaderno-prior-ci \
            --env-file data/cuaderno/local/compose.env -f .cuaderno-runs/prior-source/deploy/cuaderno/compose.local.yml down
      - name: Candidato exacto para todos los controles restantes
        shell: bash
        run: |
          sha256sum -c .cuaderno-runs/candidate-image.tar.gz.sha256
          gunzip -c .cuaderno-runs/candidate-image.tar.gz | docker load
          export CUADERNO_CANDIDATE_IMAGE="$(cat .cuaderno-runs/candidate-image-id.txt)"
          python scripts/cuaderno/local_up.py --no-build
          docker exec -e CUADERNO_ENV=test -e CUADERNO_DEMO_PASSWORD="$CUADERNO_DEMO_PASSWORD" \
            cuaderno-release-web /opt/recipes/venv/bin/python manage.py seed_cuaderno_e2e
      - name: Diecisiete evidencias del mismo candidato y gate estricto
        run: python scripts/cuaderno/ci_release_gate.py --context .cuaderno-runs/ci-context.json
      - name: Verificar que G7 conservó el contexto original
        if: always()
        shell: bash
        run: |
          python - <<'PYCONTEXT'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'g7-recovery-controller-provenance.json'
          proof = json.loads(path.read_bytes())
          assert hashlib.sha256(Path('.cuaderno-runs/ci-context.json').read_bytes()).hexdigest() == proof['context_sha256']
          proof['context_unchanged_after_gate'] = True
          with path.open('w') as stream:
              json.dump(proof, stream, sort_keys=True)
              stream.write('\n')
          PYCONTEXT
      - name: Empaquetar evidencias sin alterar el layout nativo del artefacto
        if: always()
        shell: bash
        run: |
          python - <<'PYEVIDENCE'
          import os, shutil
          from pathlib import Path
          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'g7-recovery-evidence'
          output.mkdir(mode=0o700)
          for pattern in ('.cuaderno-runs/*.json', '.cuaderno-runs/*.log',
              'data/cuaderno/scans/**/grype-linux.json', 'data/cuaderno/scans/**/summary-linux.json',
              'data/cuaderno/backups/**/restore-result.json'):
              for path in root.glob(pattern):
                  assert path.is_file() and not path.is_symlink()
                  dest = output / path.relative_to(root)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  assert not dest.exists()
                  shutil.copy2(path, dest)
          shutil.copy2(Path(os.environ['RUNNER_TEMP']) / 'g7-recovery-controller-provenance.json',
              output / 'g7-recovery-controller-provenance.json')
          PYEVIDENCE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cuaderno-release-gate-evidence
          path: ${{ runner.temp }}/g7-recovery-evidence/
          include-hidden-files: true
          retention-days: 7
      - name: Cerrar solo el preview de CI
        if: always()
        run: |
          if test -f data/cuaderno/local/compose.env; then
            docker compose --project-name cuaderno-release --env-file data/cuaderno/local/compose.env \
              -f deploy/cuaderno/compose.local.yml down || true
          fi
