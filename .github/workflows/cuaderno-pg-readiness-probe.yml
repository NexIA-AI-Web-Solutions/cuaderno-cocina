name: Cuaderno PostgreSQL readiness diagnostic

on:
  push:
    branches: [cuaderno-pg-readiness-probe-20261006]

permissions:
  contents: read

jobs:
  pg-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: 'true'
      CUADERNO_ENV: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Characterize temporary Unix and final TCP readiness
        run: python -B scripts/cuaderno/ci_pg_readiness_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cuaderno-pg-readiness-diagnostic
          path: .cuaderno-runs/pg-readiness-probe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
