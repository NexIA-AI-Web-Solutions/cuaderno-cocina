name: Cuaderno Linux DB hydration diagnostic

on:
  push:
    branches: [cuaderno-db-probe-20261006]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  db-hydration-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify and import the pinned database twice on a fresh runner
        run: python scripts/cuaderno/ci_db_hydration_probe.py
      - name: Upload only small diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cuaderno-db-hydration-probe-${{ github.run_id }}
          path: |
            .cuaderno-runs/db-hydration-probe/evidence/*.json
            .cuaderno-runs/db-hydration-probe/evidence/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
